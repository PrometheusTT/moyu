name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: matrix.node != '20'
        run: npm test
      - run: npm run compile
      - name: Verify committed dist is current
        run: git diff --exit-code -- dist
      - name: Node 20 distribution smoke test
        if: matrix.node == '20'
        env:
          MOYU_DIST: '1'
        run: ./bin/moyu --help
      - if: matrix.node == '24'
        run: npm pack --dry-run
