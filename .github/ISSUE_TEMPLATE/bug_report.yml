name: Bug report
description: Report a reproducible bug, terminal issue, or install problem / 报告问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Moyu. Security vulnerabilities belong in private vulnerability reporting, not this form. / 安全漏洞请私密报告。

  - type: input
    id: version
    attributes:
      label: Moyu version or commit / 版本或提交
      description: Release tag, commit SHA, or installation date. / 可填写版本、提交或安装日期。
      placeholder: v0.2.0 / abc1234
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js and npm versions / 版本
      placeholder: Node.js 24.8.0, npm 11.6.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS
        - Linux
        - Windows native / Windows 原生
        - Windows WSL
        - Other / 其他
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and connection / 终端与连接
      description: Include terminal version, font, and local/SSH/tmux/screen path. / 请写明终端、字体与连接方式。
      placeholder: Ghostty 1.x, local, JetBrains Mono, 100×40
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode / 运行模式
      options:
        - moyu -- codex / wrapped CLI
        - moyu play
        - moyu doctor / diagnostics
        - moyu setup / hooks
        - moyu games / Cartridge
        - Installation or packaging
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Start from a known state and list commands and keys. / 从已知状态列出命令和按键。
      placeholder: |
        1. 运行 `MOYU_TIER=braille moyu -- codex`
        2. 按 Ctrl+]
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: For captures, include theme, size, and timing. / 截图或录屏请附主题、尺寸与时刻。
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断信息
      description: Paste redacted `moyu doctor --caps` output. Remove tokens, prompts, IPs, and private paths. / 请脱敏。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing Issues. / 我搜索过现有 Issue。
          required: true
        - label: I removed credentials, prompts, IPs, usernames, and private repository details. / 我已脱敏。
          required: true
        - label: This is not a security vulnerability that needs private reporting. / 这不是安全漏洞。
          required: true
        - label: I agree to the Code of Conduct. / 我同意遵守行为准则。
          required: true
