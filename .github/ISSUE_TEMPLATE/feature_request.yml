name: Feature request
description: Propose a feature, compatibility path, or community improvement / 功能建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Moyu prioritizes the wrapped CLI, terminal safety, and low distraction. Describe the user problem before the implementation. / 请先描述用户问题，再讨论方案。

  - type: textarea
    id: problem
    attributes:
      label: Problem / 遇到的问题
      description: Who is affected, in what environment, and why are workarounds insufficient? / 请描述场景与限制。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience / 建议的体验
      description: Describe inputs, outputs, failures, and fallbacks from the user's view. / 从用户角度描述行为。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / 影响范围
      multiple: true
      options:
        - Terminal / PTY safety
        - Rendering and compatibility
        - Cartridge API
        - Built-in games
        - Agent hooks
        - Installation and release
        - Documentation and community
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案
      description: Include existing settings, a Cartridge, or doing nothing. / 包括现有配置或 Cartridge 方案。

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risks / 兼容性与风险
      description: Does this affect input, terminal restoration, SSH, Node 20, saves, or API v1? / 请说明影响。

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing Issues and project plans. / 我搜索过现有讨论。
          required: true
        - label: I described the user problem, not just an implementation. / 我描述了用户问题。
          required: true
        - label: I agree to the Code of Conduct. / 我同意遵守行为准则。
          required: true
